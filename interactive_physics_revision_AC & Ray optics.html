        tailwind.config = {
            darkMode: 'class',

                    },
                    colors: {

                        surface: '#111111',
                        surfaceElevated: '#1a1a1a',

                    animation: {
                        'float': 'float 6s ease-in-out infinite',

                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },

    <style>
        body {
            background-color: #050505;

        .orb-ro {
            bottom: -10%; right: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, rgba(0,0,0,0) 70%);

        .glass-panel {
            background: rgba(17, 17, 17, 0.6);

            border: 1px solid rgba(255, 255, 255, 0.08);

        .input-glow:focus {
            box-shadow: 0 0 0 2px var(--focus-color), 0 0 15px var(--focus-glow);
            border-color: var(--focus-color);

        /* Math formatting */

<body class="antialiased min-h-screen selection:bg-ac-DEFAULT selection:text-white">
    <div class="ambient-orb orb-ac animate-pulse-glow"></div>

    <script type="text/babel">
        // --- DATA SECTION: EXACTLY 35 QUESTIONS PER CHAPTER ---
        // Replacing HTML tags with unicode for robust rendering (e.g., ω, π, Ω, μF, ², √, °, ₀, ₁, ₂)
        
        const acData = [
            // MCQs (1-10)
            { id: "ac_1", type: "mcq", q: "The instantaneous value of an alternating voltage is e = 311 sin(100πt) volt. Its rms value and frequency are:", opts: ["311 V, 100 Hz", "311 V, 50 Hz", "220 V, 50 Hz", "220 V, 100 Hz"], ans: 2, sol: "e = e₀ sin(ωt). e₀ = 311 V, ω = 100π rad/s. E_rms = e₀/√2 = 311/1.414 ≈ 220 V; f = ω/2π = 100π/2π = 50 Hz." },
            { id: "ac_2", type: "mcq", q: "An ideal inductor of inductance (1/π) H is connected across a 220 V, 50 Hz ac source. The rms current through it is:", opts: ["0.22 A", "1.1 A", "22 A", "2.2 A"], ans: 3, sol: "X_L = 2πfL = 2π × 50 × (1/π) = 100 Ω. I_rms = V_rms/X_L = 220/100 = 2.2 A." },
            { id: "ac_3", type: "mcq", q: "At resonance in a series LCR circuit, which of the following statements is incorrect?", opts: ["The voltages across L and C individually vanish", "The impedance of the circuit is minimum", "The current in the circuit is maximum", "The power factor of the circuit is unity"], ans: 0, sol: "At resonance X_L = X_C ⇒ Z = R (minimum). The net reactive voltage (V_L - V_C) is zero, but V_L and V_C are individually non-zero (they can be very large)." },
            { id: "ac_4", type: "mcq", q: "A series LCR circuit contains L = 0.5 H, C = 2 μF and R = 50 Ω. Its resonant angular frequency is:", opts: ["500 rad/s", "1000 rad/s", "2000 rad/s", "10⁶ rad/s"], ans: 1, sol: "ω₀ = 1/√(LC) = 1/√(0.5 × 2 × 10⁻⁶) = 1/√(10⁻⁶) = 1000 rad/s." },
            { id: "ac_5", type: "mcq", q: "The energy loss in a transformer that is reduced by using a laminated iron core is due to:", opts: ["resistance of the windings", "hysteresis", "flux leakage", "eddy currents"], ans: 3, sol: "A laminated core (thin insulated sheets) increases the resistance of the paths in which eddy currents flow, reducing eddy-current loss." },
            { id: "ac_6", type: "mcq", q: "The rms value of the current i = (3 + 4 sin ωt) ampere is:", opts: ["√17 A", "5 A", "7 A", "3.5 A"], ans: 0, sol: "I_rms² = mean of i² = mean of (9 + 24 sin ωt + 16 sin²ωt). Mean of sin ωt is 0, mean of sin²ωt is 1/2. I_rms² = 9 + 16/2 = 17 ⇒ I_rms = √17 A." },
            { id: "ac_7", type: "mcq", q: "A series LCR circuit has R = 100 Ω, L = 2 H and C = 0.5 μF. Its quality factor is:", opts: ["10", "20", "40", "100"], ans: 1, sol: "ω₀ = 1/√(LC) = 1/√(2 × 0.5 × 10⁻⁶) = 1000 rad/s. Q = ω₀L/R = (1000 × 2)/100 = 20." },
            { id: "ac_8", type: "mcq", q: "A transformer of 80% efficiency takes 4 kW input at 100 V on its primary. If the secondary voltage is 240 V, the current in the secondary is:", opts: ["10 A", "16.7 A", "13.3 A", "20 A"], ans: 2, sol: "Output power = η × input power = 0.80 × 4000 = 3200 W. I_s = P_out/V_s = 3200/240 = 13.3 A." },
            { id: "ac_9", type: "mcq", q: "The capacitance of a series resonant LCR circuit (resonant freq f₀) is doubled, with L and R unchanged. The new resonant frequency is:", opts: ["√2 f₀", "f₀/2", "2 f₀", "f₀/√2"], ans: 3, sol: "f₀ = 1/(2π√(LC)) ∝ 1/√C. If C becomes 2C, f becomes f₀/√2." },
            { id: "ac_10", type: "mcq", q: "A lamp is connected in series with a capacitor across an ac source of fixed rms voltage. When the frequency of the source is increased, the brightness of the lamp:", opts: ["increases", "decreases", "remains the same", "first decreases, then increases"], ans: 0, sol: "X_C = 1/(2πfC). As f increases, X_C decreases, so impedance Z decreases and current increases. The lamp glows brighter." },
            // Assertion-Reason (11-14)
            { id: "ac_11", type: "ar", q: "Assertion (A): A choke coil is preferred to a resistor for controlling current in an ac circuit.\nReason (R): The power factor of an ideal choke coil is almost zero, so it consumes negligible power.", opts: ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], ans: 0, sol: "For an ideal choke φ ≈ 90°, so cos φ ≈ 0 and almost no power is lost. A resistor dissipates I²R heat. Both true, R explains A." },
            { id: "ac_12", type: "ar", q: "Assertion (A): A transformer cannot be used to step up or step down a dc voltage.\nReason (R): A transformer works on mutual induction, which needs a changing magnetic flux.", opts: ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], ans: 0, sol: "DC current produces constant flux, so no emf is induced (dΦ/dt = 0). Both true, R explains A." },
            { id: "ac_13", type: "ar", q: "Assertion (A): In a series LCR circuit at resonance, the voltage across the inductor can be much larger than the applied voltage.\nReason (R): At resonance the voltages across L and C are equal in magnitude and opposite in phase.", opts: ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], ans: 1, sol: "Both are true. At resonance Z=R is minimum, current is large, so V_L = I×X_L = Q×V can exceed V. R states they cancel, but doesn't explain WHY they individually exceed V." },
            { id: "ac_14", type: "ar", q: "Assertion (A): The average power consumed by an ideal capacitor in an ac circuit over a complete cycle is zero.\nReason (R): The power factor of an ideal capacitor is unity.", opts: ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], ans: 2, sol: "A is true (current leads voltage by 90°, returning energy). R is false (power factor = cos 90° = 0, not 1)." },
            // Numerical / Short Answer (2 & 3 Marks) (15-28)
            { id: "ac_15", type: "numerical", q: "A 60 μF capacitor is connected to a 110 V, 60 Hz ac supply. Determine the rms value of the current (in Amperes, to 2 decimal places).", ans: "2.49", sol: "X_C = 1/(2πfC) = 1/(2π×60×60×10⁻⁶) ≈ 44.2 Ω. I_rms = 110/44.2 ≈ 2.49 A." },
            { id: "ac_16", type: "numerical", q: "A light bulb is rated 100 W for a 220 V ac supply. Calculate the resistance of the bulb in Ohms.", ans: "484", sol: "P = V²/R ⇒ R = V²/P = (220)²/100 = 484 Ω." },
            { id: "ac_17", type: "text", q: "Define the quality factor (Q-factor) of a series LCR circuit. State what it tells us about the resonance curve.", ans: "conceptual", sol: "Definition: Q is the ratio of voltage across L (or C) at resonance to the applied voltage. Q = ω₀L/R. Significance: A large Q means a sharp, narrow resonance curve (high selectivity)." },
            { id: "ac_18", type: "numerical", q: "An ac source is e = 141.4 sin(314t) V. Find the rms voltage.", ans: "100", sol: "E_rms = e₀/√2 = 141.4 / 1.414 = 100 V." },
            { id: "ac_19", type: "numerical", q: "A step-down transformer reduces 2200 V to 220 V. Find the turns ratio (Np/Ns).", ans: "10", sol: "V_p/V_s = N_p/N_s = 2200/220 = 10." },
            { id: "ac_20", type: "text", q: "Explain why a capacitor blocks DC but allows AC to pass.", ans: "conceptual", sol: "X_C = 1/(2πfC). For DC, f = 0, making X_C infinite (open circuit). For AC, f > 0, so X_C is finite and current flows." },
            { id: "ac_21", type: "text", q: "Two LCR resonance curves have same L and C but different R. Curve 1 is sharper/taller than Curve 2. Which has larger resistance?", ans: "conceptual", sol: "Curve 2 has the larger resistance. Peak current is V/R, so a lower peak means higher R. Higher R also lowers the Q-factor, making the curve flatter." },
            { id: "ac_22", type: "numerical", q: "A series LCR circuit with L=2 H, C=8 μF, R=20 Ω is connected to 200 V. Find the resonant angular frequency (rad/s).", ans: "250", sol: "ω₀ = 1/√(LC) = 1/√(2 × 8×10⁻⁶) = 1/√(1.6×10⁻⁵) = 250 rad/s." },
            { id: "ac_23", type: "numerical", q: "A series circuit has R=80 Ω, X_L=100 Ω, X_C=40 Ω connected to 200 V ac. Calculate the impedance (in Ω).", ans: "100", sol: "Z = √[R² + (X_L - X_C)²] = √[80² + (100 - 40)²] = √[6400 + 3600] = 100 Ω." },
            { id: "ac_24", type: "numerical", q: "Power of 50 kW is delivered through a line of 0.4 Ω resistance at 2200 V. Calculate the power lost in the line (in Watts).", ans: "207", sol: "Line current I = P/V = 50000/2200 ≈ 22.7 A. Loss = I²R = (22.7)² × 0.4 ≈ 207 W." },
            { id: "ac_25", type: "text", q: "Show theoretically that current leads voltage by π/2 in a purely capacitive AC circuit.", ans: "conceptual", sol: "q = C V₀ sin(ωt). i = dq/dt = ωC V₀ cos(ωt) = i₀ sin(ωt + π/2). Thus current leads voltage by 90°." },
            { id: "ac_26", type: "numerical", q: "A lamp rated 200V, 100W operates on a 220V, 50Hz supply. What is its operating resistance (in Ω)?", ans: "400", sol: "R = V²/P = 200²/100 = 400 Ω." },
            { id: "ac_27", type: "numerical", q: "Current is i = 10 sin(100πt) A. Find the rms current (to 2 decimal places).", ans: "7.07", sol: "I_rms = I₀/√2 = 10/1.414 = 7.07 A." },
            { id: "ac_28", type: "numerical", q: "Find the frequency (Hz) at which X_L = X_C for L=0.1 H and C=10 μF (Use π ≈ 3.14).", ans: "159", sol: "f₀ = 1/(2π√(LC)) = 1/(2π√(10⁻⁶)) = 1000/2π ≈ 159 Hz." },
            // Case Studies / 4 Marks (29-30)
            { id: "ac_29", type: "text", q: "A radio receiver LCR circuit has L = 100 μH. To tune a 1.0 MHz station, what must the capacitance be? (Derive formula and state reasoning)", ans: "conceptual", sol: "At resonance, f₀ = 1/(2π√(LC)). Rearranging for C: C = 1 / (4π² f₀² L). Substituting f₀ = 10⁶ Hz and L = 10⁻⁴ H gives C ≈ 253 pF." },
            { id: "ac_30", type: "text", q: "In a series LCR circuit with R=30 Ω, X_L=50 Ω, X_C=10 Ω on 100 V supply, is it possible for V_L + V_C + V_R (arithmetic sum) to exceed 100 V? Explain.", ans: "conceptual", sol: "Yes. The voltages are phasors. V_L and V_C are 180° out of phase, and both are 90° out of phase with V_R. The arithmetic sum can exceed the source, but the phasor sum √[V_R² + (V_L - V_C)²] will exactly equal the 100 V source." },
            // Long Answers (31-35)
            { id: "ac_31", type: "text", q: "Explain the working principle of a transformer. State four causes of energy loss.", ans: "conceptual", sol: "Works on Mutual Induction. Losses: 1. Copper loss (resistance of windings), 2. Eddy currents (minimized by lamination), 3. Hysteresis loss (minimized using soft iron), 4. Flux leakage." },
            { id: "ac_32", type: "text", q: "Using a phasor diagram for a series LCR circuit, derive the expression for impedance Z.", ans: "conceptual", sol: "Draw phasors: V_R along current, V_L leading by 90°, V_C lagging by 90°. Net reactive voltage is V_L - V_C. Using Pythagoras on the voltage triangle: V² = V_R² + (V_L - V_C)². Since V = IZ, dividing by I² yields Z = √[R² + (X_L - X_C)²]." },
            { id: "ac_33", type: "numerical", q: "A town demands 800 kW at 220V, situated 15 km from a plant. Line resistance is 15 Ω total. The town gets power via a 4000V-220V transformer. Calculate the line current (in Amperes).", ans: "200", sol: "The transformer primary receives power at 4000 V. I = P/V = 800,000 W / 4000 V = 200 A." },
            { id: "ac_34", type: "text", q: "A coil draws 0.4 A on 12V DC, but only 0.24 A on 12V AC. Explain why the current decreases.", ans: "conceptual", sol: "On DC, frequency is 0, so inductive reactance X_L is 0, only resistance opposes current. On AC, X_L = 2πfL is non-zero, increasing total impedance Z = √(R² + X_L²). Higher Z means lower current for the same voltage." },
            { id: "ac_35", type: "text", q: "Show that average power P = V_rms I_rms cos(φ) in an AC circuit. What is P in a purely inductive circuit?", ans: "conceptual", sol: "p = vi = V₀I₀ sin(ωt)sin(ωt+φ). Expanding and averaging over a cycle makes the cos(2ωt) term zero, leaving (V₀I₀/2)cos(φ), which is V_rms I_rms cos(φ). In purely inductive, φ = 90°, cos(90°) = 0, so average P = 0." }
        ];

        const roData = [
            // MCQs (1-10) - Optical Instrument Qs Replaced
            { id: "ro_1", type: "mcq", q: "When a monochromatic ray of light passes from air into glass, which one of the following does not change?", opts: ["speed", "wavelength", "frequency", "direction of travel (always)"], ans: 2, sol: "Frequency is an inherent property of the source and remains constant across media. Speed and wavelength decrease in denser media." },
            { id: "ro_2", type: "mcq", q: "A concave mirror of focal length 15 cm forms a real image twice the size of the object. The object distance is:", opts: ["22.5 cm", "7.5 cm", "30 cm", "45 cm"], ans: 0, sol: "Real image ⇒ m = -v/u = -2 ⇒ v = 2u. 1/v + 1/u = 1/f ⇒ 1/(2u) + 1/u = -1/15 ⇒ 3/(2u) = -1/15 ⇒ u = -22.5 cm." },
            { id: "ro_3", type: "mcq", q: "A convex lens of focal length 20 cm forms an image of an object placed 30 cm from it. The image distance is:", opts: ["12 cm", "60 cm", "30 cm", "20 cm"], ans: 1, sol: "1/v - 1/u = 1/f ⇒ 1/v = 1/20 + 1/(-30) = 1/20 - 1/30 = 1/60 ⇒ v = +60 cm." },
            { id: "ro_4", type: "mcq", q: "A convex lens of focal length 25 cm is placed in contact with a concave lens of focal length 20 cm. The focal length of the combination is:", opts: ["+100 cm", "+45 cm", "-100 cm", "-45 cm"], ans: 2, sol: "1/F = 1/f₁ + 1/f₂ = 1/25 - 1/20 = -1/100 ⇒ F = -100 cm." },
            { id: "ro_5", type: "mcq", q: "A ray of light passes through an isosceles prism in the position of minimum deviation. Which statement is correct?", opts: ["Angle of incidence equals angle of prism", "Ray inside is parallel to the base", "Deviation is maximum", "Angle of incidence is half angle of emergence"], ans: 1, sol: "At minimum deviation i = e and r₁ = r₂ = A/2. The ray travels symmetrically, parallel to the base inside the prism." },
            { id: "ro_6", type: "mcq", q: "A light source lies at the bottom of a 12 cm deep tank of liquid (n=5/3). The radius of the circular light patch on the surface is:", opts: ["12 cm", "16 cm", "7.2 cm", "9 cm"], ans: 3, sol: "sin C = 1/n = 3/5 ⇒ tan C = 3/4. Radius r = depth × tan C = 12 × (3/4) = 9 cm." },
            { id: "ro_7", type: "mcq", q: "A convex spherical refracting surface (R=20 cm) separates air from glass (n=1.5). A parallel beam from air converges at:", opts: ["60 cm", "20 cm", "30 cm", "40 cm"], ans: 0, sol: "n₂/v - n₁/u = (n₂-n₁)/R ⇒ 1.5/v - 1/∞ = (1.5-1)/20 ⇒ 1.5/v = 0.5/20 ⇒ v = 60 cm." },
            { id: "ro_8", type: "mcq", q: "A prism of angle 60° produces a minimum deviation of 30°. The refractive index of the material is:", opts: ["1.5", "1.414", "1.732", "1.33"], ans: 1, sol: "n = sin((A+δm)/2) / sin(A/2) = sin(45°) / sin(30°) = (1/√2) / (1/2) = √2 ≈ 1.414." },
            { id: "ro_9", type: "mcq", q: "Two thin lenses of power +5D and -2D are placed in contact. The focal length of the combination is:", opts: ["+33.3 cm", "-33.3 cm", "+3 cm", "+50 cm"], ans: 0, sol: "Total Power P = P₁ + P₂ = 5 - 2 = +3D. Focal length F = 1/P = 1/3 m = +33.3 cm." },
            { id: "ro_10", type: "mcq", q: "Total internal reflection can happen when light passes from:", opts: ["Air to Glass", "Water to Glass", "Glass to Water", "Air to Water"], ans: 2, sol: "TIR strictly requires light to travel from an optically denser medium to a rarer medium. Only Glass to Water satisfies this." },
            // Assertion-Reason (11-14)
            { id: "ro_11", type: "ar", q: "Assertion (A): The image of a real object formed by a convex mirror is always virtual.\nReason (R): Rays reflected from a convex mirror always diverge.", opts: ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], ans: 0, sol: "Reflected rays diverge from a convex mirror, so they appear to intersect behind the mirror, forming a virtual image. R correctly explains A." },
            { id: "ro_12", type: "ar", q: "Assertion (A): Total internal reflection occurs when light passes from air into water if the angle is large.\nReason (R): TIR occurs only from a denser to a rarer medium.", opts: ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], ans: 3, sol: "A is false: air to water is rarer to denser, so ray bends towards normal; no TIR is possible. R is a true statement." },
            { id: "ro_13", type: "ar", q: "Assertion (A): A convex glass lens has a longer focal length when immersed in water than in air.\nReason (R): The refractive index of glass relative to water is smaller than relative to air.", opts: ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], ans: 0, sol: "Lens maker formula: 1/f = (n_rel - 1)(1/R₁ - 1/R₂). In water, relative n is smaller, so focal length increases. R explains A." },
            { id: "ro_14", type: "ar", q: "Assertion (A): Lateral shift produced by a glass slab increases with the thickness of the slab.\nReason (R): Lateral shift is independent of the angle of incidence.", opts: ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], ans: 2, sol: "Lateral shift x = t*sin(i-r)/cos(r). It is proportional to thickness 't' (Assertion is true). However, it depends heavily on angle of incidence 'i' (Reason is false)." },
            // Numerical / Short Answer (2 & 3 Marks) (15-28)
            { id: "ro_15", type: "numerical", q: "An object is 12 cm in front of a convex mirror of radius 48 cm. Find the image distance v (in cm).", ans: "8", sol: "f = R/2 = +24 cm. 1/v = 1/f - 1/u = 1/24 - 1/(-12) = 1/24 + 2/24 = 3/24 = 1/8. v = +8 cm." },
            { id: "ro_16", type: "text", q: "A convex lens focuses red light and violet light at different points. For which color is the focal length shorter? Give reason.", ans: "conceptual", sol: "Violet. Refractive index of glass is greater for violet than red (n_v > n_r). By Lens Maker's formula, greater 'n' means shorter focal length." },
            { id: "ro_17", type: "numerical", q: "A pool appears 1.5 m deep viewed vertically. If n_water is 4/3, find actual depth in meters.", ans: "2", sol: "Apparent depth = Real depth / n. Real depth = 1.5 × (4/3) = 2.0 m." },
            { id: "ro_18", type: "text", q: "Define critical angle and state two conditions for Total Internal Reflection (TIR).", ans: "conceptual", sol: "Critical angle is the angle of incidence in denser medium for which angle of refraction is 90°. Conditions: 1. Light must travel from denser to rarer medium. 2. Angle of incidence must exceed critical angle." },
            { id: "ro_19", type: "text", q: "Explain why a diamond sparkles much more than a glass piece of the same shape.", ans: "conceptual", sol: "Diamond has a very high refractive index (2.42), giving it a very small critical angle (~24°). Light entering suffers multiple TIRs before emerging, causing it to sparkle." },
            { id: "ro_20", type: "numerical", q: "Radii of a biconvex lens are 10 cm and 15 cm. If n=1.5, find focal length in air (in cm).", ans: "12", sol: "1/f = (n-1)(1/R₁ - 1/R₂) = (1.5 - 1)(1/10 - (-1/15)) = 0.5 × (5/30) = 1/12 ⇒ f = 12 cm." },
            { id: "ro_21", type: "text", q: "Write the lens maker's formula and explain the terms used in it.", ans: "conceptual", sol: "1/f = (n₂₁ - 1)(1/R₁ - 1/R₂). f = focal length, n₂₁ = refractive index of lens relative to surroundings, R₁ and R₂ are radii of curvature of the two surfaces." },
            { id: "ro_22", type: "numerical", q: "Object is 60 cm from convex spherical surface (R=20 cm, separating air and glass n=1.5). Find image distance (in cm).", ans: "180", sol: "n₂/v - n₁/u = (n₂-n₁)/R ⇒ 1.5/v - 1/(-60) = (1.5-1)/20 ⇒ 1.5/v + 1/60 = 1/40 ⇒ 1.5/v = 1/120 ⇒ v = 180 cm." },
            { id: "ro_23", type: "text", q: "An object is 30 cm in front of a convex lens (f=20 cm). A concave lens (f=-20 cm) is placed 45 cm behind it. Explain how to find the final image position.", ans: "conceptual", sol: "Lens 1: 1/v₁ = 1/20 + 1/(-30) = 1/60 ⇒ v₁ = +60 cm. This image is a virtual object for Lens 2 at u₂ = +(60-45) = +15 cm. Lens 2: 1/v₂ = 1/(-20) + 1/15 = 1/60 ⇒ v₂ = +60 cm." },
            { id: "ro_24", type: "numerical", q: "Water (n=4/3) is 12 cm deep. Oil (n=1.5) is 9 cm deep on top. Find apparent depth of a coin at the bottom (in cm).", ans: "15", sol: "Apparent depth = Σ(t/n) = 12/(4/3) + 9/1.5 = 9 + 6 = 15 cm." },
            { id: "ro_25", type: "text", q: "A ray enters normally on a face of a right isosceles glass prism (n=1.5). Show that TIR occurs at the hypotenuse.", ans: "conceptual", sol: "Ray hits hypotenuse at 45°. Critical angle for glass C = sin⁻¹(1/1.5) ≈ 41.8°. Since incidence angle (45°) > C (41.8°), TIR takes place." },
            { id: "ro_26", type: "text", q: "Derive f = R/2 for a concave mirror using a ray diagram.", ans: "conceptual", sol: "A ray parallel to axis hits mirror at M, reflects through focus F. Radius CM is normal. By reflection, angle of incidence = reflection = θ. From geometry, MF subtends 2θ at pole. For small aperture, tan(θ) ≈ θ ≈ MD/R, tan(2θ) ≈ 2θ ≈ MD/f. Thus 2(MD/R) = MD/f ⇒ f = R/2." },
            { id: "ro_27", type: "numerical", q: "Find the critical angle (degrees, to 1 decimal) for glass (n=1.5) to water (n=1.33) interface.", ans: "62.5", sol: "sin C = n_rarer / n_denser = 1.33 / 1.5 = 0.887. C = arcsin(0.887) ≈ 62.5°." },
            { id: "ro_28", type: "text", q: "Why does the sun look reddish at sunrise and sunset? Is this related to optics discussed?", ans: "conceptual", sol: "This is due to Rayleigh scattering (Intensity ∝ 1/λ⁴), not geometric optics. Shorter wavelengths (blue) scatter away passing through the thick atmosphere, leaving longer wavelengths (red) to reach the eye." },
            // Case Studies / 4 Marks (29-30)
            { id: "ro_29", type: "text", q: "Optical fibres use a core (n=1.5) and cladding (n=1.2). State the guiding principle and calculate the critical angle.", ans: "conceptual", sol: "Principle is Total Internal Reflection. Light must stay in the denser core. Critical angle C = sin⁻¹(n₂/n₁) = sin⁻¹(1.2/1.5) = sin⁻¹(0.8) ≈ 53°." },
            { id: "ro_30", type: "text", q: "A biconvex lens (n=1.5) is immersed in a liquid of n=1.6. Does it behave as converging or diverging? Explain.", ans: "conceptual", sol: "Diverging. Lens maker formula: 1/f = (n_lens/n_liquid - 1)(...). Since 1.5/1.6 < 1, the first term is negative, making f negative. The convex lens becomes a diverging lens in a denser liquid." },
            // Long Answers (31-35)
            { id: "ro_31", type: "text", q: "Derive n₂/v - n₁/u = (n₂ - n₁)/R for a convex spherical surface.", ans: "conceptual", sol: "Using paraxial rays from object O to surface at M, forming image I. Angles α, β, γ. Snell's law n₁i = n₂r. Exterior angle relations i = α + β, β = r + γ. Substitute angles as tangent (h/u, h/R, h/v) and apply sign convention to get final relation." },
            { id: "ro_32", type: "text", q: "Derive the prism formula n = sin[(A+δm)/2] / sin(A/2).", ans: "conceptual", sol: "Deviation δ = i + e - A. At minimum deviation (δm), symmetry implies i = e and r₁ = r₂ = A/2. Therefore δm = 2i - A ⇒ i = (A+δm)/2. Using Snell's Law n = sin(i)/sin(r), substitute i and r to get the formula." },
            { id: "ro_33", type: "numerical", q: "A solid glass sphere (n=1.5, R=10 cm) has a point object 30 cm from surface. Find first image position (cm).", ans: "90", sol: "1.5/v - 1/(-30) = (1.5-1)/10 ⇒ 1.5/v = 1/20 - 1/30 = 1/60 ⇒ v = 90 cm." },
            { id: "ro_34", type: "text", q: "Explain the phenomenon of mirage. Which optical principle causes it?", ans: "conceptual", sol: "Caused by Total Internal Reflection. On hot days, air near ground is hotter (rarer) than air above (denser). Light from sky bends away from normal until incidence angle exceeds critical angle, undergoing TIR and appearing as water reflection." },

                    <header className="glass-panel sticky top-0 z-50 border-b border-white/5 shadow-2xl">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

                                <div className="text-center md:text-left">

                                    </h1>
                                    <p className="text-sm text-gray-400 mt-2 font-medium tracking-wide">Class XII Unit Test Prep 2026-27</p>

                                    <div className="inline-flex items-center space-x-2 bg-surfaceElevated px-4 py-2 rounded-xl border border-white/10 shadow-lg">
                                        <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>

                                        </p>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Navigation Tabs */}
                            <nav className="flex overflow-x-auto hide-scrollbar space-x-2 mt-8 pb-2">
                                {[
                                    { id: 'revision', label: 'Revision Notes', icon: 'fa-book-open', baseColor: 'emerald' },
                                    { id: 'ac', label: 'Alternating Current', icon: 'fa-bolt', baseColor: 'cyan' },
                                    { id: 'ro', label: 'Ray Optics', icon: 'fa-lightbulb', baseColor: 'pink' }
                                ].map(tab => {
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <button
                                            key={tab.id}
                                            onClick={() => handleTabClick(tab.id)}
                                            className={`interactive-btn whitespace-nowrap flex items-center space-x-3 px-6 py-3.5 rounded-2xl font-bold text-sm transition-all duration-300 ${
                                                isActive 
                                                ? `bg-${tab.baseColor}-500/10 text-${tab.baseColor}-400 border border-${tab.baseColor}-500/30 shadow-[0_0_15px_rgba(var(--tw-color-${tab.baseColor}-500),0.2)]` 
                                                : `bg-transparent text-gray-400 hover:text-white hover:bg-white/5 border border-transparent`
                                            }`}
                                        >
                                            <i className={`fa-solid ${tab.icon} ${isActive ? 'scale-110' : ''} transition-transform`}></i>
                                            <span>{tab.label}</span>
                                        </button>
                                    );
                                })}
                            </nav>

                    </header>

                    <main className="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 py-12">

        root.render(<App />);
